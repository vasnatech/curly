[package]
name = "curly-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "curly"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:curly-gui"]

[dependencies]
curly-core = { path = "../curly-core" }
curly-gui = { path = "../curly-gui", optional = true }
reqwest = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
